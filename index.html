<body>
    <div class="container">
        <h1>JSON to CSV Express</h1>
        <p class="subtitle">Convert JSON datasets or API payloads into clean CSV tables instantly with 100% client-side privacy.</p>
        
        <a href="https://buy.stripe.com/28E9AL51N3fgdo18Kgc7u03" target="_blank" class="btn-stripe">🚀 Unlock Unlimited Access - €4.99</a>

        <label class="upload-area" id="drop-zone">
            <span id="file-label">📁 Click here or drag and drop your JSON file</span>
            <input type="file" id="json-file" accept=".json">
        </label>

        <textarea id="csv-output" placeholder="Your formatted CSV output will appear here..." readonly></textarea>

        <div class="btn-group">
            <button id="copy-btn" onclick="copyCSV()">Copy CSV</button>
            <button id="download-btn" onclick="downloadCSV()">Download .csv</button>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('json-file');
        const fileLabel = document.getElementById('file-label');
        const csvOutput = document.getElementById('csv-output');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                fileLabel.textContent = '📄 ' + file.name;
                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        const text = event.target.result;
                        const jsonData = JSON.parse(text);
                        const csvResult = convertJsonToCsv(jsonData);
                        csvOutput.value = csvResult;
                    } catch (err) {
                        csvOutput.value = 'Error: Invalid JSON format.';
                    }
                };
                reader.readAsText(file);
            }
        });

        function convertJsonToCsv(data) {
            let items = Array.isArray(data) ? data : [data];
            if (items.length === 0) return '';

            const keys = [...new Set(items.flatMap(item => Object.keys(item)))];
            let csv = keys.join(',') + '\n';

            items.forEach(row => {
                const values = keys.map(key => {
                    let val = row[key] !== undefined && row[key] !== null ? row[key] : '';
                    if (typeof val === 'object') {
                        val = JSON.stringify(val);
                    }
                    val = String(val).replace(/"/g, '""');
                    return `"${val}"`;
                });
                csv += values.join(',') + '\n';
            });

            return csv;
        }

        function copyCSV() {
            if (!csvOutput.value) return;
            navigator.clipboard.writeText(csvOutput.value).then(() => {
                const btn = document.getElementById('copy-btn');
                const originalText = btn.textContent;
                btn.textContent = 'Copied!';
                setTimeout(() => btn.textContent = originalText, 2000);
            });
        }

        function downloadCSV() {
            if (!csvOutput.value) return;
            const blob = new Blob([csvOutput.value], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'data.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
